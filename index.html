*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}

button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}

.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto}

.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:var(--brand-ink)}
.biz{font-size:12px;color:var(--ink-3);font-weight:500;padding:0 10px 14px;margin-top:-12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.nav .sep{height:1px;background:var(--line);margin:10px 6px}
.sync{font-size:12px;color:var(--ink-3);padding:14px 10px 0}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:26px;letter-spacing:-.02em;margin:0;font-weight:800}
.sub{color:var(--ink-3);font-size:13.5px;margin-top:2px}
h2{font-size:16px;margin:0 0 12px;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi .l{font-size:12.5px;color:var(--ink-3);font-weight:600}

.kpi .n{font-size:12px;color:var(--ink-3);margin-top:2px}

.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.nav a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:650;color:var(--ink-2);min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type=number]{text-align:right}
textarea{resize:vertical}
.table-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
tfoot td{font-weight:800;border-top:2px solid var(--line);border-bottom:none}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.low{background:var(--warn-soft);color:var(--warn)}
.chip.out{background:var(--bad-soft);color:var(--bad)}
.chip.mut{background:var(--surface-2);color:var(--ink-2)}
tr.lowrow td{background:var(--warn-soft);background:color-mix(in srgb,var(--warn-soft) 60%,transparent)}

.alert{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:14px 16px;margin-bottom:16px;border:1px solid}
.alert.bad{background:var(--bad-soft);border-color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent);color:var(--ink)}
.alert.good{background:var(--good-soft);border-color:var(--good);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.alert.info{background:var(--brand-soft);border-color:var(--brand);border-color:color-mix(in srgb,var(--brand) 30%,transparent)}

/* invoice print */
/* mobile */
.tabbar{display:none}

  .tabbar a.on{color:var(--brand)}
  .tabbar svg{width:22px;height:22px}
  .tabbar .dot{position:absolute;top:0;right:12px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:0 5px}
  h1{font-size:22px}
  .hide-m{display:none}
}

@media (max-width:700px){
  input,select,textarea{font-size:16px}

  .lines,.lines tbody{display:block;width:100%}
  .lines tr{display:grid;grid-template-columns:1fr 1fr;grid-gap:8px 10px;gap:8px 10px;padding:12px;margin:0 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
  .lines td{display:block;padding:0!important;border:none!important;width:auto!important;min-width:0}
  .lines td:first-child{grid-column:1/-1}
  .lines td[data-label]:not(:first-child)::before{content:attr(data-label);display:block;font-size:11.5px;font-weight:700;color:var(--ink-3);margin-bottom:3px}
  .lines td[data-amt]{align-self:center;text-align:left!important;font-weight:800;font-size:17px}
  .lines td[data-amt]::before{content:'Amount'!important}
  .lines td:last-child{grid-column:1/-1;justify-self:end}
  .lines td:last-child::before{display:none!important}
  .table-wrap{-webkit-overflow-scrolling:touch}
}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%}
  .inv{border:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

      S.cols[c].forEach((d) => {

      });

    modal(`<h2>Restoring backup\u2026</h2><p class="muted" id="rsProg">0 of ${total} records</p><div class="bar"><i id="rsBar" style="width:0%"></i></div><p class="muted" style="font-size:13px;margin-top:12px">Keep this page open until it finishes.</p>`);
